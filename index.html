<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>njq8 | tg/@vadet</title>
</head>
<body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh">
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;} resize();
    window.addEventListener('resize',resize);

    const s=100; // half-size of cube
    const verts=[
      [-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],
      [-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]
    ];
    const faces=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]];

    let ang=0;
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const w=canvas.width/2,h=canvas.height/2;
      const tverts=verts.map(v=>{
        let [x,y,z]=v;
        // rotate around Y
        let cy=Math.cos(ang),sy=Math.sin(ang);
        let x1=x*cy+z*sy;
        let z1=-x*sy+z*cy;
        // rotate around X for tilt
        let cx=Math.cos(ang*0.5),sx=Math.sin(ang*0.5);
        let y1=y*cx - z1*sx;
        let z2=y*sx + z1*cx;
        return [x1,y1,z2];
      });

      const projected=tverts.map(([x,y,z])=>{
        const scale=400/(z+600);
        return [w+x*scale,h+y*scale,z];
      });

      faces.sort((a,b)=>{
        const za=a.reduce((s,i)=>s+projected[i][2],0)/4;
        const zb=b.reduce((s,i)=>s+projected[i][2],0)/4;
        return zb-za;
      });

      faces.forEach(face=>{
        ctx.beginPath();
        ctx.moveTo(projected[face[0]][0],projected[face[0]][1]);
        for(let i=1;i<face.length;i++) ctx.lineTo(projected[face[i]][0],projected[face[i]][1]);
        ctx.closePath();
        ctx.fillStyle='#ccc';
        ctx.fill();
        ctx.strokeStyle='#333';
        ctx.stroke();

        const cx=face.reduce((s,i)=>s+projected[i][0],0)/4;
        const cy=face.reduce((s,i)=>s+projected[i][1],0)/4;
        ctx.fillStyle='#000';
        ctx.font='bold 20px sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('njq8',cx,cy);
      });

      ang+=0.01;
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
